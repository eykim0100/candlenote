name: 데이터 갱신

on:
  schedule:
    # 한국시간 평일 오후 2시 7분 (공공데이터 시세는 다음 영업일 오후 1시쯤 올라와요)
    - cron: '7 5 * * 1-5'
  workflow_dispatch:   # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 준비
        run: pip install -r requirements.txt

      - name: 국내 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/collect_kr.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터가 없어요."
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin main   # 그사이 화면에서 저장한 편집 내용과 합치기
            git push
          fi
